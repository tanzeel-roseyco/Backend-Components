[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "backend-components"
version = "0.1.0"
description = "Reusable Python backend components"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.3.2",
  "pandas==2.3.1",
  "requests==2.33.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pandas-stubs==2.3.0.250703",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "ruff==0.12.7",
  "types-requests==2.32.4.20250611",
]

[tool.hatch.build.targets.wheel]
packages = ["backend_components"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E9", "F"]


[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
